name: Build Portfolio

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: portfolio-resume

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  integration-test:

    needs: build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: portfolio-resume

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run ci

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > vite.log 2>&1 &
          echo $! > vite.pid

      - name: Start PDF server
        run: |
          npm run pdf-server > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait services
        run: |
          npx wait-on \
            http://127.0.0.1:4173 \
            http://127.0.0.1:3000/health \
            --timeout 30000

      - name: Generate PDF
        run: |
          curl \
            -X POST \
            http://127.0.0.1:3000/api/pdf \
            --output portfolio.pdf

      - name: Validate PDF
        run: |
          file portfolio.pdf | grep PDF

      - name: Copy PDF to deployment
        run: |
          cp portfolio.pdf  portfolio-resume/dist/portfolio.pdf

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path:  portfolio-resume/dist

      - name: Stop servers
        if: always()
        run: |
          kill $(cat vite.pid) || true
          kill $(cat server.pid) || true

  deploy:

    needs:
      - build
      - integration-test

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: portfolio-resume

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path:  portfolio-resume/dist

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path:  portfolio-resume/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4